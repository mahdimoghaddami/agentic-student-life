# Current nine-condition evaluation suite. Run with an explicit new --out-root.
# Matches the dated per-condition presets; no model calls during configuration loading.

[defaults.system]
mode = "multi_agent"
model = "gemini:gemini-3.6-flash"
temperature = 0.3
max_workers = 4
min_request_interval_s = 1.0
max_output_tokens = 8192
thinking_level = "low"
budget_usd = 20.0
input_usd_per_million = 0.75
output_usd_per_million = 3.75

[defaults.planning]
enabled = true
max_rounds = 2

[defaults.reflection]
enabled = true
max_rounds = 2

[defaults.memory]
enabled = true
history_k = 5

[defaults.skills]
enabled = true

[defaults.tools]
enabled = true
max_turns = 5

