[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "studentlife-coach"
version = "1.0.0"
description = "Reproducible multi-agent StudentLife coaching experiments"
requires-python = ">=3.10"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]
[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
[project.scripts]
studentlife-coach = "coach.cli:main"
[tool.setuptools.packages.find]
include = ["coach*", "studentlife_context*"]
